# md-docs addon — nginx location snippet
# deploy/install.sh inserts this into the dashboard's nginx site (idempotent,
# anchored on its "# md-docs addon" marker).

# --- md-docs addon: /docs/ on the dashboard's TLS front ---
location /docs/ {
    proxy_pass http://127.0.0.1:9992/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}