# md-docs application settings
# md-docs.conf lives next to server.js; path can be relocated via MD_DOCS_CONF.
# Precedence: env vars (MD_DOCS_HOST / MD_DOCS_PORT / MD_DOCS_DIR / MD_DOCS_TOKEN) > this file > defaults.

# Interface to bind; 127.0.0.1 behind the dashboard's nginx front, 0.0.0.0 = all interfaces
host = 127.0.0.1

# Port to listen on
port = 9992

# Directory where the markdown doc files live (relative = next to the app, or any absolute path)
docsDir = mds

# Optional: set to require a bearer token on every /api/ request.
# token =  (leave commented out to keep the site open — lab mode)